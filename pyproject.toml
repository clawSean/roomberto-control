[project]
name = "roomberto-control"
version = "0.1.0"
description = "Guarded read-only Roomba Combo 105 controller"
requires-python = ">=3.11"
dependencies = [
  "roombapy-prime",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.uv.sources]
roombapy-prime = { git = "https://github.com/johnnyh1975/roombapy-prime.git", rev = "8fce9139822886ab03aceb5a5787eb851cc0a095" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
